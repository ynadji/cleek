name: CI build for CLEEK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Run by hand from the Actions tab, or with `gh workflow run makefile.yml
  # --ref <branch>`, to get a linux binary out of a branch without pushing to
  # main or opening a PR.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      LISP: sbcl-bin
      # Absolute, and recursive thanks to the trailing //, so ASDF finds
      # cleek.asd at the workspace root and every deps/*/ checkout below it.
      #
      # This replaces a `sudo mkdir ~/common-lisp` + `sudo mv common-lisp /root/`
      # dance that left ASDF scanning one directory while the checkouts sat in
      # another. When that scan comes up empty quicklisp substitutes its own
      # dist releases of netaddr, cl-dns and cl-tld without saying so, and the
      # build silently used a netaddr eight months stale. ci.lisp's
      # CHECK-PINNED-DEPS now fails the job if that happens again.
      CL_SOURCE_REGISTRY: "${{ github.workspace }}//"

    steps:
    - uses: actions/checkout@v4
    # REF is each repository's default branch: tracking a branch rather than a
    # tag or SHA means an unrelated push to a dependency can still change what
    # this job builds.
    - uses: actions/checkout@v4
      with:
        repository: ynadji/netaddr
        ref: main
        path: deps/netaddr
    - uses: actions/checkout@v4
      with:
        repository: ynadji/cl-dns
        ref: main
        path: deps/cl-dns
    - uses: actions/checkout@v4
      with:
        repository: lu4nx/cl-tld
        ref: master
        path: deps/cl-tld
    - uses: 40ants/setup-lisp@v4

    - name: Install dependencies
      run: |
        ros run -- --version
        make deps

    - name: Test CLEEK
      run: make test

    - name: Build CLEEK
      run: make build

    - uses: actions/upload-artifact@v4
      with:
        name: cleek
        path: bin/cleek
        overwrite: true
        # Never upload silently-missing output: a build that produced no binary
        # must not look like a job that produced an artifact.
        if-no-files-found: error
