name: CI build for CLEEK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Run by hand from the Actions tab, or with `gh workflow run makefile.yml
  # --ref <branch>`, to get a linux binary out of a branch without pushing to
  # main or opening a PR.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      LISP: sbcl-bin

    steps:
    - name: Foo
      run: sudo mkdir ~/common-lisp
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: ynadji/netaddr
        path: common-lisp/netaddr
    - uses: actions/checkout@v4
      with:
        repository: ynadji/cl-dns
        path: common-lisp/cl-dns
    - uses: actions/checkout@v4
      with:
        repository: lu4nx/cl-tld
        path: common-lisp/cl-tld
    - uses: 40ants/setup-lisp@v4

    - name: Install dependencies
      run: |
        ros run -- --version
        sudo mv common-lisp /root/
        sudo ls -al /root/common-lisp
        sudo ln -s $(pwd) /root/common-lisp/
        sudo make deps

    - name: Test CLEEK
      run: sudo make test

    - name: Build CLEEK
      run: sudo make build

    - uses: actions/upload-artifact@v4
      with:
        name: cleek
        path: bin/cleek
        overwrite: true
        # Never upload silently-missing output: a build that produced no binary
        # must not look like a job that produced an artifact.
        if-no-files-found: error
